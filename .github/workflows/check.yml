name: Check
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx tsc -p tsconfig.control.json
      - run: node --import tsx --test tests/*.test.ts
      - run: npx eslint --config eslint.control.config.js control helper.ts server.ts cli.ts web src/domain.ts tests/control.test.ts tests/server.test.ts
